<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SageOS Package Catalog — Changelog</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0 0 60px 0;
  }
  header { padding: 40px 24px 10px; max-width: 800px; margin: 0 auto; }
  header h1 { font-size: 1.6rem; margin-bottom: 6px; }
  header p { color: var(--muted); }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px 24px 0; }
  .entry {
    display: flex; gap: 20px; margin-bottom: 22px; position: relative;
  }
  .entry .version-col {
    flex: 0 0 90px; text-align: right;
  }
  .entry .version-badge {
    background: var(--accent); color: #0d1117; font-weight: 700;
    border-radius: 6px; padding: 3px 9px; font-size: 0.85rem; display: inline-block;
  }
  .entry .date { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
  .entry .body {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px;
  }
  .entry ul { margin: 0; padding-left: 18px; }
  .entry li { margin-bottom: 4px; font-size: 0.92rem; line-height: 1.4; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📋 Catalog Changelog</h1>
  <p>What changed between <code>sage-pkg update-catalog</code> versions. <a href="index.html">← home</a> · <a href="packages.html">packages</a> · <a href="changelog.json">raw changelog.json</a></p>
</header>
<div class="container" id="entries"><p class="empty">Loading…</p></div>
<script>
fetch('changelog.json').then(r => r.json()).then(log => {
  const el = document.getElementById('entries');
  el.innerHTML = '';
  log.slice().reverse().forEach(entry => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="version-col">
        <span class="version-badge">v${entry.version}</span>
        <div class="date">${entry.date.slice(0,10)}</div>
      </div>
      <div class="body">
        <ul>${entry.changes.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    `;
    el.appendChild(div);
  });
  if (log.length === 0) el.innerHTML = '<p class="empty">No changelog entries yet.</p>';
});
</script>
</body>
</html>
