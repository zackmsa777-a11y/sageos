set timeout=8
set default=0

set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan

menuentry "SageOS v5.1-beta2 -- Real Edition" {
    linux /boot/vmlinuz console=tty0 console=ttyS0
    initrd /boot/initramfs.gz
}

menuentry "SageOS v5.1-beta2 (Debug Mode)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0 loglevel=7
    initrd /boot/initramfs.gz
}
